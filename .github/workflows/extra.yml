name: extra
'on':
  workflow_dispatch: null
jobs:
  build-gcc:
    name: build
    if: ${{ !github.event.pull_request.head.repo.fork && github.event.action != 'labeled'
      || github.event.label.name == 'approved-for-ci' }}
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os:
        - almalinux-9.7
        - almalinux-10.1
        - alpine-3.23
        - debian-11.11
        - debian-12.12
        - debian-13.2
        - fedora-37
        - fedora-42
        - opensuse-tumbleweed
        - ubuntu-22.04
        - ubuntu-24.04
        preset:
        - linux.gcc.all.release
        - linux.clang.all.release
        jobs:
        - 4
        exclude:
        - os: almalinux-9.7
          preset: linux.clang.all.release
    runs-on: ubuntu-latest
    container:
      image: marcosbento/lumen:${{ matrix.os }}
      options: --user root
    timeout-minutes: 60
    steps:
    - name: Display build context
      run: 'echo "Working directory: ${{ github.workspace }}"

        echo "Environment:"

        echo "$(env)"

        echo "OS info:"

        echo "$(cat /etc/os-release)"

        echo "CPU info:"

        echo "$(cat /proc/cpuinfo)"

        echo "Memory info:"

        echo "$(cat /proc/meminfo)"

        echo "Disk info:"

        echo "$(df -h)"

        '
    - name: Checkout 'ecbuild'
      uses: actions/checkout@v4
      with:
        repository: ecmwf/ecbuild
        path: ecbuild
    - name: Checkout 'ecflow'
      uses: actions/checkout@v4
      with:
        path: ecflow
    - name: Configure ecflow
      run: 'cd ${RUNNER_WORKSPACE}/ecflow/ecflow

        cmake --preset ${{ matrix.preset }}

        '
    - name: Build ecflow
      run: 'cd ${RUNNER_WORKSPACE}/ecflow/ecflow

        cmake --build --preset ${{ matrix.preset }} --jobs ${{ matrix.jobs }}

        '
    - name: Test ecflow (default)
      if: ${{ matrix.os != 'alpine-3.23' && matrix.os != 'opensuse-tumbleweed' }}
      run: 'cd ${RUNNER_WORKSPACE}/ecflow/ecflow

        ctest --preset  ${{ matrix.preset }} --output-on-failure -L nightly -j ${{
        matrix.jobs }}

        '
    - name: Test ecflow (specific to Alpine)
      if: ${{ matrix.os == 'alpine-3.23' }}
      run: 'cd ${RUNNER_WORKSPACE}/ecflow/ecflow

        ctest --preset  ${{ matrix.preset }} --output-on-failure -L nightly -E s_foolproof
        -j ${{ matrix.jobs }}

        '
    - name: Test ecflow (specific to openSUSE)
      if: ${{ matrix.os == 'opensuse-tumbleweed' }}
      run: 'cd ${RUNNER_WORKSPACE}/ecflow/ecflow

        ctest --preset  ${{ matrix.preset }} --output-on-failure -L nightly -E ''s_(udp|foolproof)''
        -j ${{ matrix.jobs }}

        '
    - name: Lint ecflow
      if: ${{ matrix.preset == 'linux.clang.all.release' && matrix.os == 'ubuntu-24.04'
        && !always() }}
      run: 'cd ${RUNNER_WORKSPACE}/ecflow/ecflow

        run-clang-tidy -j ${{ matrix.jobs }} -p ${RUNNER_WORKSPACE}/ecflow/ecflow/.deploy/build/${{
        matrix.preset }} | tee clang-tidy-report.txt

        '
    - name: Archive lint report
      if: ${{ matrix.preset == 'linux.clang.all.release' && matrix.os == 'ubuntu-24.04'
        && !always() }}
      uses: actions/upload-artifact@v4
      with:
        name: cling-tidy-report
        path: ${RUNNER_WORKSPACE}/ecflow/ecflow/clang-tidy-report.txt
